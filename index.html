.dim,.ver{color:var(--dim)}.ver{font-size:12px}
button,input[type=text],select{font:inherit;color:var(--ink);background:var(--bt);border:1px solid var(--ln);border-radius:6px;padding:6px 10px}
button{cursor:pointer}button:hover:not(:disabled){border-color:var(--ac)}button:disabled{opacity:.45;cursor:default}
input:disabled{opacity:.6}.pri{background:var(--ac);color:var(--acink);border-color:var(--ac)}
#th{margin-left:auto}#path{flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dim)}
main{flex:1;min-height:0;display:grid;grid-template-columns:290px 1fr 310px;grid-template-rows:auto 1fr;gap:8px;padding:8px}
.box{background:var(--pn);border:1px solid var(--ln);border-radius:8px}
#L{grid-row:1/3;display:flex;flex-direction:column;gap:8px;min-height:0}
#Bq{display:flex;gap:6px}#Bq input{flex:1;min-width:0}
#C{padding:6px;display:flex;flex-wrap:wrap;gap:6px;min-height:42px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--bt);border:1px solid var(--ln);border-radius:14px;padding:2px 4px 2px 10px}
.chip button{border:0;background:none;padding:0 6px;font-size:16px;line-height:1;color:var(--ac)}
#cnt{padding:0 4px}
#D{flex:1;min-height:0;overflow:auto;padding:4px}#D div{padding:4px 6px;border-radius:5px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#D div:hover{background:var(--bt)}#D div.on{background:var(--ac);color:var(--acink)}
#E{grid-column:2/4;display:flex;align-items:center;gap:4px;padding:4px;height:128px}
#strip{flex:1;display:flex;gap:6px;overflow-x:auto;scroll-behavior:smooth;align-items:center;height:100%}
#strip canvas{height:112px;width:auto;flex:none;border-radius:4px;cursor:pointer;background:var(--vw);outline:2px solid transparent}
#strip canvas.on{outline-color:var(--ac)}
#E>button{height:100%;padding:0 8px;font-size:20px}
#Fw{display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}#cap{padding:6px 10px;word-break:break-all;font-size:13px;min-height:40px}#cap b{font-weight:600}#F{flex:1;position:relative;overflow:hidden;background:var(--vw);touch-action:none;cursor:grab;min-height:0}
#F img{position:absolute;left:0;top:0;max-width:none;transform-origin:0 0;user-select:none;-webkit-user-drag:none}
#zb{position:absolute;right:8px;top:8px;display:flex;gap:4px}#zb button{width:34px;padding:4px 0}
#G{display:flex;flex-direction:column;gap:6px;padding:8px;min-height:0}
#gf label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px}#gf input{width:100%;display:block;margin-top:2px;color:var(--ink)}
#gx{flex:1;min-height:0;overflow:auto;font-size:12px}#gx td{padding:2px 4px;vertical-align:top;border-bottom:1px solid var(--ln);word-break:break-word}#gx td:first-child{color:var(--dim);white-space:nowrap}
#G .bar{display:flex;gap:6px}#G .bar button{flex:1}
footer{display:flex;justify-content:space-between;gap:10px;padding:4px 12px;font-size:12px;color:var(--dim);border-top:1px solid var(--ln)}
@media(max-width:860px){body{height:auto;min-height:100dvh}main{display:flex;flex-direction:column}#L{max-height:60vh}#F{height:60vh;flex:none}#G{max-height:70vh}}
</style></head><body>

function parseYear(t){

 if(!m)return null;const y=+m[3];let a=y,b=y;

 let s;if(typeof v=='string')s=dec(v);
 else if(Array.isArray(v))s=v.map(x=>Array.isArray(x)?(x.length==2?x[0]+'/'+x[1]:x.join(' ')):x).join(', ');else s=String(v);
 return s.length>80?s.slice(0,80)+'…':s;
}
async function loadExif(f,i){
 ex=null;jd=null;$('#gf').innerHTML='';$('#ed').disabled=$('#sv').disabled=true;
 if(!JPG.test(f.name)){$('#gx').innerHTML='<span class="dim">EXIF visas bara för JPEG.</span>';return}
 const file=await getFile(f);
 const d=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(file)});
 if(sel!==i)return;jd=d;
 try{ex=piexif.load(jd)}catch(e){ex={'0th':{},Exif:{},GPS:{},Interop:{},'1st':{},thumbnail:null}}
 showExif();
}
function showExif(){
 $('#gf').innerHTML=FLD.map((d,i)=>'<label>'+d[0]+'<input type="text" data-f="'+i+'" value="'+esc(dec(ex[d[1]][d[2]]))+'"'+(editing?'':' disabled')+'></label>').join('');
 const T={'0th':piexif.TAGS['0th'],Exif:piexif.TAGS.Exif,GPS:piexif.TAGS.GPS},rows=[];
 for(const g in T)for(const t in ex[g]){if(t==37500)continue;rows.push('<tr><td>'+esc((T[g][t]||{}).name||String(t))+'</td><td>'+esc(fmt(ex[g][t]))+'</td></tr>')}
 $('#gx').innerHTML=rows.length?'<table>'+rows.join('')+'</table>':'<span class="dim">Ingen EXIF-data i filen</span>';
 $('#ed').disabled=rw===false;$('#ed').textContent=editing?'Avbryt':'Redigera';$('#sv').disabled=!editing;
}
async function canWrite(){
 if(!dirH||!dirH.requestPermission)return true;
 if(rw===true)return true;
 let p='denied';try{p=await dirH.queryPermission({mode:'readwrite'});if(p!=='granted')p=await dirH.requestPermission({mode:'readwrite'})}catch(e){}
 rw=p==='granted';return rw;
}
$('#ed').onclick=async()=>{
 if(!ex)return;
 if(!editing&&!(await canWrite())){editing=false;showExif();msg('Redigering är inte tillåten. Bilderna kan fortfarande visas.');return}
 editing=!editing;if(!editing)try{ex=piexif.load(jd)}catch(e){}msg('');showExif();
};
async function save(){
 const f=shown[sel];if(!f||!ex)return;
 document.querySelectorAll('#gf input').forEach(inp=>{const d=FLD[+inp.dataset.f],v=inp.value.trim();if(v)ex[d[1]][d[2]]=enc(v);else delete ex[d[1]][d[2]]});
 let ni;try{ni=piexif.insert(piexif.dump(ex),jd)}catch(e){msg('Kunde inte skapa EXIF: '+e);return}
 const bin=atob(ni.split(',')[1]),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
 const blob=new Blob([u],{type:'image/jpeg'});
 if(f.h&&dirH&&dirH.requestPermission){
  if(await canWrite()){
   if(!confirm('Skriva över originalfilen '+f.name+'?'))return;
   try{const w=await f.h.createWritable();await w.write(blob);await w.close();jd=ni;f.file=null;editing=false;showExif();msg('Sparat i filen.');return}
   catch(e){msg('Kunde inte skriva: '+e.message);return}
  }
  editing=false;showExif();msg('Redigering är inte tillåten. Bilderna kan fortfarande visas.');return;
 }
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=f.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
 jd=ni;editing=false;showExif();msg('Sparad som ny nedladdning. Originalet är orört.');
}
$('#sv').onclick=save;
